<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQu for Reliance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .section {
            margin-bottom: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }
        .section-header {
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-content {
            padding: 1rem;
            display: none;
        }
        .section-content.show {
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }
        #answer {
            background-color: #e9ecef;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-top: 1rem;
        }
        .citations {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .citation {
            display: inline-block;
            margin-right: 0.5rem;
            padding: 0.2rem 0.5rem;
            background-color: #dee2e6;
            border-radius: 0.25rem;
        }
        .paragraph {
            margin-bottom: 1rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 0.25rem;
        }
        .page-number {
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 0.5rem;
        }
        .pdf-link {
            margin-bottom: 1rem;
        }
        .initialization-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .progress {
            width: 300px;
            margin: 20px 0;
        }
        .main-content {
            display: none;
        }
        .pdf-selector {
            margin-bottom: 1rem;
        }
        .pdf-selector select {
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="initialization-screen" id="initScreen">
        <h2>Initializing FAQu for Reliance</h2>
        <p>Loading and processing document...</p>
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                 role="progressbar" 
                 style="width: 0%" 
                 id="initProgress">0%</div>
        </div>
    </div>

    <div class="container mt-5 main-content" id="mainContent">
        <h1 class="mb-4">FAQu for Reliance</h1>
        
        <div class="pdf-selector">
            <label for="pdfSelect" class="form-label">Select PDF Document:</label>
            <select id="pdfSelect" class="form-select" onchange="changePDF(this.value)">
                {% for pdf in pdfs %}
                <option value="{{ pdf }}">{{ pdf }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="pdf-link">
            <a href="#" id="pdfViewLink" target="_blank" class="btn btn-outline-primary">
                <i class="bi bi-file-pdf"></i> View PDF Document
            </a>
        </div>
        
        <div class="mb-4">
            <div class="input-group">
                <input type="text" id="question" class="form-control" placeholder="Enter your question...">
                <button class="btn btn-primary" onclick="search()">Search</button>
            </div>
        </div>

        <div class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2" id="loading-message">Processing your question...</p>
        </div>

        <div id="result" style="display: none;">
            <div class="section">
                <div class="section-header" onclick="toggleSection('reasoning')">
                    <h5 class="mb-0">Reasoning</h5>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="reasoning" class="section-content"></div>
            </div>

            <div class="section">
                <div class="section-header" onclick="toggleSection('paragraphs')">
                    <h5 class="mb-0">Relevant Paragraphs</h5>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="paragraphs" class="section-content"></div>
            </div>

            <div id="answer" class="mt-4"></div>
            <div id="citations" class="citations"></div>
            <div id="error-message" class="alert alert-warning mt-3" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Update page title with current PDF name
        function updatePageTitle(pdfName) {
            document.title = `FAQu for Reliance - ${pdfName}`;
            document.getElementById('pdfViewLink').href = `/pdf/${pdfName}`;
        }

        // Change PDF document
        async function changePDF(pdfName) {
            if (!pdfName) return;
            
            // Show loading screen
            document.getElementById('initScreen').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            
            try {
                const response = await fetch('/change-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ pdf_name: pdfName }),
                });
                
                if (!response.ok) {
                    throw new Error('Failed to change PDF');
                }
                
                // Start checking initialization status
                checkInitialization();
            } catch (error) {
                console.error('Error changing PDF:', error);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Error changing PDF. Please try again.';
                errorMessage.style.display = 'block';
                document.getElementById('initScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        }

        // Check initialization status
        async function checkInitialization() {
            try {
                const response = await fetch('/loading-status');
                const data = await response.json();
                
                // Update progress bar
                const progressBar = document.getElementById('initProgress');
                progressBar.style.width = `${data.progress}%`;
                progressBar.textContent = `${data.progress}%`;
                
                // Update status message
                const loadingMessage = document.getElementById('loading-message');
                if (data.status_message) {
                    loadingMessage.textContent = data.status_message;
                }
                
                if (!data.is_loading) {
                    // Show main content and hide initialization screen
                    document.getElementById('initScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    
                    // Update page title and PDF link
                    if (data.current_pdf) {
                        updatePageTitle(data.current_pdf);
                    }
                } else {
                    // Check again after a short delay
                    setTimeout(checkInitialization, 500);
                }
            } catch (error) {
                console.error('Error checking initialization status:', error);
                setTimeout(checkInitialization, 1000);
            }
        }

        function toggleSection(sectionId) {
            const content = document.getElementById(sectionId);
            const header = content.previousElementSibling;
            const icon = header.querySelector('.toggle-icon');
            
            content.classList.toggle('show');
            icon.textContent = content.classList.contains('show') ? '▼' : '▶';
        }

        async function search() {
            const question = document.getElementById('question').value.trim();
            if (!question) {
                // Show error in UI instead of alert
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Please enter a question.';
                errorMessage.style.display = 'block';
                document.getElementById('result').style.display = 'block';
                return;
            }

            // Show loading
            document.querySelector('.loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('loading-message').textContent = 'Analyzing document chunks...';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question }),
                });

                const data = await response.json();
                
                // Update loading message with status
                if (data.status_message) {
                    document.getElementById('loading-message').textContent = data.status_message;
                }
                
                // Show result container
                document.getElementById('result').style.display = 'block';
                
                // Handle initialization state
                if (data.is_initializing) {
                    const errorMessage = document.getElementById('error-message');
                    errorMessage.textContent = data.error;
                    errorMessage.style.display = 'block';
                    document.getElementById('answer').style.display = 'none';
                    document.getElementById('citations').style.display = 'none';
                    document.getElementById('paragraphs').innerHTML = '';
                    return;
                }
                
                if (data.error) {
                    // Display error message in the UI
                    const errorMessage = document.getElementById('error-message');
                    errorMessage.textContent = data.error;
                    errorMessage.style.display = 'block';
                    
                    // Clear other sections
                    document.getElementById('answer').style.display = 'none';
                    document.getElementById('citations').style.display = 'none';
                    document.getElementById('paragraphs').innerHTML = '';
                    
                    // If we have reasoning, show it
                    if (data.reasoning) {
                        document.getElementById('reasoning').textContent = data.reasoning;
                    }
                    
                    // If we have relevant paragraphs, show them
                    if (data.relevant_paragraphs && data.relevant_paragraphs.length > 0) {
                        document.getElementById('paragraphs').innerHTML = data.relevant_paragraphs
                            .map(p => `
                                <div class="paragraph">
                                    <div class="page-number">${p.pages}</div>
                                    <div class="paragraph-text">${p.text}</div>
                                </div>
                            `)
                            .join('');
                    }
                } else {
                    // Clear any previous error message
                    document.getElementById('error-message').style.display = 'none';
                    
                    // Update UI with results
                    document.getElementById('reasoning').textContent = data.reasoning || 'No reasoning provided.';
                    
                    // Format paragraphs with page numbers
                    if (data.relevant_paragraphs && data.relevant_paragraphs.length > 0) {
                        document.getElementById('paragraphs').innerHTML = data.relevant_paragraphs
                            .map(p => `
                                <div class="paragraph">
                                    <div class="page-number">${p.pages}</div>
                                    <div class="paragraph-text">${p.text}</div>
                                </div>
                            `)
                            .join('');
                    } else {
                        document.getElementById('paragraphs').innerHTML = '<p>No relevant paragraphs found.</p>';
                    }
                    
                    if (data.answer) {
                        document.getElementById('answer').textContent = data.answer;
                        document.getElementById('answer').style.display = 'block';
                    } else {
                        document.getElementById('answer').style.display = 'none';
                    }
                    
                    // Display citations if available
                    if (data.citations && data.citations.length > 0) {
                        const citationsHtml = data.citations
                            .map(citation => `<span class="citation">${citation}</span>`)
                            .join('');
                        document.getElementById('citations').innerHTML = citationsHtml;
                        document.getElementById('citations').style.display = 'block';
                    } else {
                        document.getElementById('citations').style.display = 'none';
                    }
                }
            } catch (error) {
                // Display error message in the UI
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'An error occurred while processing your question. Please try again.';
                errorMessage.style.display = 'block';
                
                // Clear other sections
                document.getElementById('answer').style.display = 'none';
                document.getElementById('citations').style.display = 'none';
                document.getElementById('paragraphs').innerHTML = '';
            } finally {
                // Keep the loading message visible for a moment to show the final status
                setTimeout(() => {
                    document.querySelector('.loading').style.display = 'none';
                }, 1000);
            }
        }

        // Allow Enter key to trigger search
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                search();
            }
        });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial PDF name in title
            const initialPdf = document.getElementById('pdfSelect').value;
            if (initialPdf) {
                updatePageTitle(initialPdf);
            }
            
            // Start checking initialization status
            checkInitialization();
        });
    </script>
</body>
</html>
