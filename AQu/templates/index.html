<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQu for Reliance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .section {
            margin-bottom: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #fff;
        }
        .section-header {
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dee2e6;
        }
        .section-content {
            padding: 1rem;
            display: none;
            background-color: #fff;
        }
        .section-content.show {
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }
        #answer {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-top: 1rem;
            border: 1px solid #dee2e6;
        }
        .citations {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .citation {
            display: inline-block;
            margin-right: 0.5rem;
            padding: 0.2rem 0.5rem;
            background-color: #e9ecef;
            border-radius: 0.25rem;
            text-decoration: none;
            color: #0d6efd;
        }
        .citation:hover {
            background-color: #dee2e6;
            color: #0a58ca;
        }
        .paragraph {
            margin-bottom: 1rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 0.25rem;
            border: 1px solid #dee2e6;
        }
        .page-number {
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 0.5rem;
            cursor: pointer;
            text-decoration: underline;
        }
        .page-number:hover {
            color: #0a58ca;
        }
        .pdf-link {
            margin-bottom: 1rem;
        }
        .pdf-link a {
            text-decoration: none;
        }
        .pdf-link a:hover {
            text-decoration: underline;
        }
        .initialization-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .progress {
            width: 300px;
            margin: 20px 0;
        }
        .main-content {
            display: none;
        }
        .pdf-selector {
            margin-bottom: 1rem;
        }
        .pdf-selector select {
            max-width: 300px;
        }
        .copy-icon {
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 8px;
            padding: 4px;
            border-radius: 4px;
            color: #1d4ed8;
        }
        .copy-icon:hover {
            color: #1e40af;
            background-color: rgba(0, 0, 0, 0.05);
        }
        .section-copy-icon {
            font-size: 1.1rem;
        }
        .subsection-copy-icon {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="initialization-screen" id="initScreen">
        <h2>Initializing FAQu for Reliance</h2>
        <p>Loading and processing document...</p>
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                 role="progressbar" 
                 style="width: 0%" 
                 id="initProgress">0%</div>
        </div>
    </div>

    <div class="container mt-5 main-content" id="mainContent">
        <h1 class="mb-4">FAQu for Reliance</h1>
        
        <div class="pdf-selector">
            <label for="pdfSelect" class="form-label">Select PDF Document:</label>
            <select id="pdfSelect" class="form-select" onchange="changePDF(this.value)">
                {% for pdf in pdfs %}
                <option value="{{ pdf }}">{{ pdf }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="pdf-link">
            <a href="#" id="pdfViewLink" target="_blank" class="btn btn-outline-primary">
                <i class="fas fa-file-pdf"></i> View PDF Document
            </a>
        </div>
        
        <div class="mb-4">
            <div class="input-group">
                <input type="text" id="question" class="form-control" placeholder="Enter your question...">
                <button class="btn btn-primary" onclick="search()">Search</button>
            </div>
        </div>

        <div class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2" id="loading-message">Processing your question...</p>
        </div>

        <div id="result" style="display: none;">
            <div class="section">
                <div class="section-header" onclick="toggleSection('reasoning')">
                    <h5 class="mb-0">Reasoning</h5>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="reasoning" class="section-content"></div>
            </div>

            <div class="section">
                <div class="section-header" onclick="toggleSection('paragraphs')">
                    <h5 class="mb-0">Relevant Paragraphs</h5>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="paragraphs" class="section-content"></div>
            </div>

            <div id="answer" class="mt-4"></div>
            <div id="citations" class="citations"></div>
            <div id="error-message" class="alert alert-warning mt-3" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Update page title with current PDF name
        function updatePageTitle(pdfName) {
            document.title = `FAQu for Reliance - ${pdfName}`;
            const pdfLink = document.getElementById('pdfViewLink');
            pdfLink.href = `/pdf/${pdfName}`;
            pdfLink.innerHTML = `<i class="fas fa-file-pdf"></i> View ${pdfName}`;
        }

        // Function to handle page number clicks
        function handlePageClick(pageNumber) {
            const pdfLink = document.getElementById('pdfViewLink');
            const currentPdf = pdfLink.href.split('/').pop();
            window.open(`/pdf/${currentPdf}#page=${pageNumber}`, '_blank');
        }

        // Function to format citations with clickable page numbers
        function formatCitations(citations) {
            const citationsDiv = document.getElementById('citations');
            citationsDiv.innerHTML = '';
            
            citations.forEach(citation => {
                const citationElement = document.createElement('span');
                citationElement.className = 'citation';
                
                if (citation.startsWith('Page ')) {
                    const pageNumbers = citation.replace('Page ', '').split(', ');
                    const pageLinks = pageNumbers.map(page => 
                        `<span class="page-number" onclick="handlePageClick(${page})">Page ${page}</span>`
                    ).join(', ');
                    citationElement.innerHTML = pageLinks;
                } else {
                    citationElement.textContent = citation;
                }
                
                citationsDiv.appendChild(citationElement);
            });
        }

        // Function to format relevant paragraphs with clickable page numbers
        function formatParagraphs(paragraphs) {
            const paragraphsDiv = document.getElementById('paragraphs');
            paragraphsDiv.innerHTML = '';
            
            paragraphs.forEach(paragraph => {
                const paragraphElement = document.createElement('div');
                paragraphElement.className = 'paragraph';
                
                if (paragraph.pages && paragraph.pages.length > 0) {
                    const pageLinks = paragraph.pages.map(page => 
                        `<span class="page-number" onclick="handlePageClick(${page})">Page ${page}</span>`
                    ).join(', ');
                    paragraphElement.innerHTML = `<div class="page-number">${pageLinks}</div>`;
                }
                
                paragraphElement.innerHTML += `<div class="paragraph-text">${paragraph.text}</div>`;
                paragraphsDiv.appendChild(paragraphElement);
            });
        }

        // Change PDF document
        async function changePDF(pdfName) {
            if (!pdfName) return;
            
            // Show loading screen
            document.getElementById('initScreen').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            
            try {
                const response = await fetch('/api/change-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ pdf_name: pdfName }),
                });
                
                if (!response.ok) {
                    throw new Error('Failed to change PDF');
                }
                
                // Start checking initialization status
                checkInitialization();
            } catch (error) {
                console.error('Error changing PDF:', error);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Error changing PDF. Please try again.';
                errorMessage.style.display = 'block';
                document.getElementById('initScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        }

        // Check initialization status
        async function checkInitialization() {
            try {
                const response = await fetch('/api/loading-status');
                const data = await response.json();
                
                // Update progress bar
                const progressBar = document.getElementById('initProgress');
                progressBar.style.width = `${data.progress}%`;
                progressBar.textContent = `${data.progress}%`;
                
                // Update status message
                const loadingMessage = document.getElementById('loading-message');
                if (data.status_message) {
                    loadingMessage.textContent = data.status_message;
                }
                
                if (!data.is_loading) {
                    // Show main content and hide initialization screen
                    document.getElementById('initScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    
                    // Update page title and PDF link
                    if (data.current_pdf) {
                        updatePageTitle(data.current_pdf);
                    }
                } else {
                    // Check again after a short delay
                    setTimeout(checkInitialization, 500);
                }
            } catch (error) {
                console.error('Error checking initialization status:', error);
                setTimeout(checkInitialization, 1000);
            }
        }

        function toggleSection(sectionId) {
            const content = document.getElementById(sectionId);
            const header = content.previousElementSibling;
            const icon = header.querySelector('.toggle-icon');
            
            content.classList.toggle('show');
            icon.textContent = content.classList.contains('show') ? '▼' : '▶';
        }

        // Update the search function to use the new formatting functions
        async function search() {
            const question = document.getElementById('question').value;
            if (!question) return;

            document.querySelector('.loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('answer').innerHTML = data.answer;
                    formatCitations(data.citations);
                    formatParagraphs(data.relevant_paragraphs);
                    document.getElementById('reasoning').innerHTML = data.reasoning;
                    document.getElementById('result').style.display = 'block';
                } else {
                    document.getElementById('error-message').textContent = data.error || 'An error occurred';
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Failed to process question';
                document.getElementById('error-message').style.display = 'block';
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        }

        // Allow Enter key to trigger search
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                search();
            }
        });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial PDF name in title
            const initialPdf = document.getElementById('pdfSelect').value;
            if (initialPdf) {
                updatePageTitle(initialPdf);
            }
            
            // Start checking initialization status
            checkInitialization();
        });

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Show a temporary success message
                const icon = event.target;
                const originalClass = icon.className;
                icon.className = 'fa-solid fa-check copy-icon';
                setTimeout(() => {
                    icon.className = originalClass;
                }, 1000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body>
</html>
